# Publie les trois images Docker sur le GitHub Container Registry à chaque tag de version (vX.Y.Z) :
#   ghcr.io/<propriétaire>/bpmn-pilot       l'éditeur (nginx)
#   ghcr.io/<propriétaire>/bpmn-pilot-mcp  le serveur MCP et le chat intégré (Node)
#   ghcr.io/<propriétaire>/bpmn-pilot-renderer  Chromium sans écran du mode sans navigateur (facultatif)
#
# Tags d'image pour v1.2.3 : 1.2.3, 1.2, 1 et latest. Une préversion (v1.3.0-rc.1) n'a que le sien.
# Chaque push sur main publie aussi le tag edge : la dernière version de développement, non stable,
# pour les essais. Elle affiche « edge-<commit> » comme version.
# Lancement manuel (Actions > Docker > Run workflow) : choisir un tag de version dans « Use workflow from ».
#
# La première publication crée des paquets privés. Les rendre publics une fois, dans les réglages
# de chaque paquet (Package settings > Change visibility), pour que chacun les télécharge sans compte.

name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Lecture seule par défaut : seul le job qui publie reçoit le droit d'écrire les paquets.
permissions:
  contents: read

# Sur main, seul le dernier push compte : un build edge en cours cède la place au suivant.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  image:
    # Versions et main (tag edge) seulement : un lancement manuel depuis une autre branche s'arrête ici.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # publication sur ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bpmn-pilot
            file: Dockerfile
            title: BPMN-Pilot
            description: BPMN 2.0 editor in the browser (bpmn-js), with an AI co-pilot. Pairs with bpmn-pilot-mcp.
            # Adresse relative du serveur MCP, relayée par le nginx de l'éditeur (voir nginx.conf.template).
            build-args: VITE_MCP_BRIDGE_URL=/bridge
            mcp-name: ''
          - name: bpmn-pilot-mcp
            file: mcp/Dockerfile
            title: BPMN-Pilot MCP server
            description: MCP server and built-in AI chat for BPMN-Pilot (bpmn-pilot image).
            build-args: ''
            # Lu par le registre MCP officiel (voir server.json et le job registry plus bas).
            mcp-name: io.modelcontextprotocol.server.name=io.github.Leylines-Prism/bpmn-pilot
          - name: bpmn-pilot-renderer
            file: renderer/Dockerfile
            title: BPMN-Pilot renderer
            description: Headless Chromium for the headless mode of the BPMN-Pilot MCP server (optional).
            build-args: ''
            mcp-name: ''
    env:
      # Annotations posées aussi sur l'index multi-plateforme, où le registre lit la description.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Construction arm64 sur la machine amd64 de GitHub.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
            ${{ matrix.mcp-name }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
            ${{ matrix.mcp-name }}

      # Version affichée par l'éditeur : le tag (v1.2.3), ou edge-<commit> pour main.
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then v="$REF_NAME"; else v="edge-${GITHUB_SHA::7}"; fi
          echo "app=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            ${{ matrix.build-args }}
            APP_VERSION=${{ steps.version.outputs.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Provenance de la construction et liste des composants (SBOM), jointes à l'image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Inscrit le serveur MCP dans le registre officiel (registry.modelcontextprotocol.io), une fois
  # l'image bpmn-pilot-mcp publiée. Authentification par OIDC GitHub : aucun secret à créer.
  # Les préversions (v1.3.0-rc.1) ne sont pas inscrites.
  registry:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # connexion au registre MCP par OIDC
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      # mcp-publisher, à une version fixe, vérifié par sa signature Sigstore avant usage.
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # La version et le tag de l'image viennent du tag Git (v1.2.3 donne 1.2.3).
      - name: Set version in server.json
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          jq --arg v "$v" '.version = $v | .packages[0].identifier = "ghcr.io/leylines-prism/bpmn-pilot-mcp:" + $v' server.json > server.tmp
          mv server.tmp server.json

      - run: ./mcp-publisher login github-oidc

      - run: ./mcp-publisher publish

  # Relais local de la version en ligne : extension Claude Desktop (bpmn-pilot.mcpb) jointe à la
  # release, et paquet npm bpmn-pilot-mcp. Le paquet est publié avec le secret NPM_TOKEN, ou par
  # publication de confiance (OIDC) une fois réglée sur npmjs.com : le secret peut alors disparaître.
  # Les préversions (v1.3.0-rc.1) ne sont pas publiées.
  relay:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # fichier .mcpb joint à la release
      id-token: write  # provenance npm, et publication de confiance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm ci --omit=dev
        working-directory: mcp

      - name: Check the relay version
        env:
          VERSION: ${{ github.ref_name }}
        run: test "$(jq -r .version relay/package.json)" = "${VERSION#v}"

      - run: npm run pack:mcpb

      - name: Attach the Claude Desktop extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release upload "$VERSION" relay/dist/bpmn-pilot.mcpb --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish bpmn-pilot-mcp on npm
        working-directory: relay
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
