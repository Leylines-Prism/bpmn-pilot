<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPMN-Pilot · Leylines</title>
  <link rel="icon" href="/src/brand/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/src/brand/favicon-white.svg" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/svg+xml" href="/src/brand/favicon-black.svg" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/src/brand/favicon-black-180.png" />
  <meta name="description" content="A BPMN 2.0 editor in the browser. Draw processes by hand, with an AI co-pilot, or from any MCP agent. Open source, in English and French." />
  <!-- Aperçu des liens partagés (LinkedIn, Mastodon, messageries…). L'adresse de l'image et la
       balise og:url deviennent absolues au build si SITE_URL est défini (voir vite.config.js). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BPMN-Pilot" />
  <meta property="og:title" content="BPMN-Pilot" />
  <meta property="og:description" content="Draw BPMN 2.0 processes in the browser, by hand, with an AI co-pilot, or from any MCP agent. Open source, in English and French." />
  <meta property="og:image" content="social-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="640" />
  <meta property="og:image:alt" content="BPMN-Pilot: a small process with a start event, three tasks and two parallel gateways, drawn as lines of light" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="fr_FR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BPMN-Pilot" />
  <meta name="twitter:description" content="Draw BPMN 2.0 processes in the browser, by hand, with an AI co-pilot, or from any MCP agent." />
  <meta name="twitter:image" content="social-preview.png" />
  <meta name="twitter:image:alt" content="BPMN-Pilot: a small process with a start event, three tasks and two parallel gateways, drawn as lines of light" />
  <script>
    // Applique le thème choisi avant le premier affichage, sans clignotement
    try { const t = localStorage.getItem('bpmn-editor-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch {}
    // Langue de l'interface (anglais par défaut) : les textes sont traduits par src/i18n/static-texts.js
    try { if (localStorage.getItem('bpmn-editor-lang') === 'fr') document.documentElement.lang = 'fr' } catch {}
  </script>
</head>
<body>
  <div id="toolbar">
    <div class="brand">
      <a class="brand-logo clickable" href="about.html" target="_blank" rel="noopener" title="Leylines" aria-label="Leylines (opens in a new tab)">
        <img class="only-light" src="/src/brand/leylines-logo-white.svg" alt="" />
        <img class="only-dark" src="/src/brand/leylines-logo-transparent.svg" alt="" />
      </a>
      <h1>BPMN-Pilot</h1>
    </div>
    <label class="file-name-field" id="file-name-field" title="File name used when saving and exporting">
      <span class="file-name-icon" aria-hidden="true"></span>
      <input id="file-name" type="text" value="diagram" maxlength="120" spellcheck="false" autocomplete="off"
        aria-label="File name" placeholder="File name" />
      <span class="file-name-ext" aria-hidden="true">.bpmn</span>
    </label>
    <button class="btn" id="btn-new" title="Start an empty diagram (replaces the autosave)" data-icon="new">New</button>
    <button class="btn" id="btn-open-menu" title="Open a file, paste XML, build from a table or a grid, or compare with a file" data-icon="open" popovertarget="open-menu" aria-haspopup="menu">Open</button>
    <div id="open-menu" class="menu" popover role="menu">
      <button class="btn" id="btn-open" title="Open a BPMN 2.0 diagram from your computer, or an encrypted .bpmn.enc file" data-icon="open" role="menuitem">.bpmn, .xml or encrypted file…</button>
      <button class="btn dmn-only expert-only" id="btn-open-dmn" title="Add the decisions of a DMN file to the open diagram, to link them to its business rule tasks" data-icon="table" role="menuitem">.dmn file (decisions)…</button>
      <button class="btn" id="btn-import-xml" title="Paste BPMN XML; a process without layout is laid out automatically" data-icon="code" role="menuitem">Paste XML…</button>
      <button class="btn" id="btn-import-table" title="Build a process from a table of steps pasted from Excel, or a .csv or .xlsx file, without AI" data-icon="table" role="menuitem">From a table…</button>
      <button class="btn" id="btn-import-grid" title="For a workshop: roles in columns, tasks in rows, one click per task; the diagram is built with one lane per role" data-icon="grid" role="menuitem">Roles × tasks grid…</button>
      <div class="menu-sep" role="separator"></div>
      <button class="btn" id="btn-compare-file" title="Compare the open diagram with a .bpmn file, side by side" data-icon="compare" role="menuitem">Compare with a file…</button>
    </div>
    <input type="file" id="compare-input" accept=".bpmn,.xml" style="display:none" />
    <input type="file" id="file-input" accept=".bpmn,.xml,.enc" style="display:none" />
    <input type="file" id="dmn-input" accept=".dmn,.xml" style="display:none" />
    <button class="btn" id="btn-export" title="Export as BPMN, XML, SVG, PNG or PDF, procedure sheets (PDF, Word, Markdown), an HTML documentation page, or print" data-icon="save" popovertarget="export-menu" aria-haspopup="menu">Export</button>
    <div id="export-menu" class="menu" popover role="menu">
      <button class="btn" id="btn-save" title="BPMN 2.0 file, readable by other BPMN tools" data-icon="save" role="menuitem">.bpmn file</button>
      <button class="btn" id="btn-save-xml" title="Same content as .bpmn, with the .xml extension" data-icon="save" role="menuitem">.xml file</button>
      <button class="btn" id="btn-save-encrypted" title="The .bpmn file encrypted in your browser with a password (AES-256), to send a sensitive process" data-icon="lock" role="menuitem">Encrypted .bpmn file…</button>
      <button class="btn expert-only mod-forms-only" id="btn-save-forms" title="The task forms of this diagram as form-js files (.form, or a .zip of them), to deploy with the process in Camunda 8" data-icon="form" role="menuitem">Task forms (.form files)</button>
      <button class="btn dmn-only expert-only" id="btn-save-dmn" title="The decisions of this diagram as a DMN 1.3 file, for Camunda Modeler or a decision engine" data-icon="table" role="menuitem">Decisions (.dmn file)</button>
      <button class="btn expert-only mod-camunda-export-only" id="btn-camunda-8" title="BPMN file prepared for Camunda 8: platform set, executable process, gateway conditions in FEEL from the Condition field or the flow label, assigned tasks as user tasks" data-icon="engine" role="menuitem">BPMN for Camunda 8</button>
      <button class="btn expert-only mod-camunda-export-only" id="btn-camunda-7" title="BPMN file prepared for Camunda 7: platform set, executable process, gateway conditions in JUEL from the Condition field or the flow label, assigned tasks as user tasks" data-icon="engine" role="menuitem">BPMN for Camunda 7</button>
      <div class="menu-sep" role="separator"></div>
      <button class="btn" id="btn-svg" title="Vector image, sharp at any size" data-icon="image" role="menuitem">SVG image</button>
      <button class="btn" id="btn-png" title="Bitmap image at 2× resolution, white background" data-icon="image" role="menuitem">PNG image</button>
      <button class="btn" id="btn-pdf" title="Vector PDF document" data-icon="pdf" role="menuitem">PDF document</button>
      <div class="menu-sep" role="separator"></div>
      <button class="btn" id="btn-sheets-pdf" title="One page per activity, in the order of the flow, with its documentation" data-icon="pdf" role="menuitem">Procedure sheets (PDF)</button>
      <button class="btn" id="btn-sheets-md" title="The same procedure sheets, as Markdown text" data-icon="code" role="menuitem">Procedure sheets (Markdown)</button>
      <button class="btn" id="btn-sheets-docx" title="The same procedure sheets, as an editable Word document" data-icon="word" role="menuitem">Procedure sheets (Word)</button>
      <button class="btn" id="btn-doc-html" title="One self-contained web page: the diagram, and the sheet of each element on a click. Opens in any browser, without BPMN Pilot" data-icon="doc" role="menuitem">Documentation page (HTML)</button>
      <button class="btn" id="btn-raci-xlsx" title="Who performs, answers for, is consulted on and informed of each activity, as an Excel workbook" data-icon="table" role="menuitem">RACI matrix (Excel)</button>
      <button class="btn expert-only mod-user-stories-only" id="btn-stories-md" title="The user stories and acceptance criteria of each activity, in the order of the flow, as Markdown" data-icon="code" role="menuitem">User stories (Markdown)</button>
      <div class="menu-sep" role="separator"></div>
      <button class="btn" id="btn-xml" title="Show the BPMN XML, ready to copy" data-icon="code" role="menuitem">XML code to copy…</button>
      <button class="btn" id="btn-print" title="Print, or save as PDF from the browser's dialog" data-icon="print" role="menuitem">Print…</button>
    </div>
    <button class="btn" id="btn-library" data-icon="library" title="Save, reopen, rename or delete diagrams (Ctrl+S saves)">My diagrams</button>
    <div class="sep"></div>
    <button class="btn" id="btn-layout" data-icon="layout" title="Tidy up the layout">Tidy up</button>
    <button class="btn" id="btn-present" data-icon="present" title="Presentation: the diagram alone, full screen">Presentation</button>
    <button class="btn" id="btn-expert" data-icon="expert" popovertarget="expert-menu" aria-haspopup="menu" title="Expert mode: token simulation and process report">Expert</button>
    <button type="button" class="expert-switch" id="expert-switch" role="switch" aria-checked="false" aria-label="Expert mode" title="Turn expert mode on"><span class="expert-switch-knob" aria-hidden="true"></span></button>
    <div id="expert-menu" class="menu" popover role="menu">
      <div class="menu-group menu-group-simulation mod-simulation-only" role="group">
        <button class="btn" id="btn-simulation" data-icon="play" title="Run tokens through the process, with the heatmap and branch probabilities" role="menuitem">Simulation</button>
        <div class="menu-row"><button class="btn copilot-only" disabled id="btn-ai-probabilities" data-icon="assistant" title="Ask the AI co-pilot for realistic branch probabilities, to review before simulating" role="menuitem">Propose probabilities</button><span class="copilot-help" id="help-ai-probabilities" role="img" tabindex="0" aria-label="Connect an AI model to the co-pilot to use this function"><span class="copilot-help-icon" data-icon="help"></span></span></div>
      </div>
      <div class="menu-group menu-group-analyses" role="group">
        <button class="btn mod-process-mining-only" id="btn-mining" title="Load an event log exported from your ERP, CRM or ticketing tool, and see on the diagram what really happens: passes, durations, deviations" data-icon="mining" role="menuitem">Analyze an event log (process mining)…</button>
        <div class="menu-row mod-ai-potential-only"><button class="btn copilot-only" disabled id="btn-ai-potential" data-icon="assistant" title="The AI co-pilot rates each activity: automatable, AI-assisted or human, with its reason and safeguard, and lists the risks and controls of the steps given to AI; the result goes into the process report" role="menuitem">Which activities to hand to AI?</button><span class="copilot-help" id="help-ai-potential" role="img" tabindex="0" aria-label="Connect an AI model to the co-pilot to use this function"><span class="copilot-help-icon" data-icon="help"></span></span></div>
        <div class="menu-row mod-user-stories-only"><button class="btn copilot-only" disabled id="btn-ai-stories" data-icon="assistant" title="The AI co-pilot writes the user stories and acceptance criteria of each activity, from its name, lane, documentation and systems" role="menuitem">User stories by activity</button><span class="copilot-help" id="help-ai-stories" role="img" tabindex="0" aria-label="Connect an AI model to the co-pilot to use this function"><span class="copilot-help-icon" data-icon="help"></span></span></div>
        <button class="btn dmn-only expert-only" id="btn-dmn-drd" data-icon="table" title="Open the decisions of this diagram and their requirements diagram" role="menuitem">Decisions of the diagram…</button>
      </div>
      <div class="menu-group menu-group-report mod-report-only" role="group" aria-labelledby="expert-report-title">
        <div class="menu-row"><button class="btn copilot-only" disabled id="btn-ai-analysis" data-icon="assistant" title="The AI co-pilot runs 100 tokens, reads the report and writes its analysis into it" role="menuitem">Co-pilot analysis</button><span class="copilot-help" id="help-ai-analysis" role="img" tabindex="0" aria-label="Connect an AI model to the co-pilot to use this function"><span class="copilot-help-icon" data-icon="help"></span></span></div>
        <div class="menu-subtitle" id="expert-report-title">Process report</div>
        <div class="menu-formats">
          <button class="btn" id="btn-report-pdf" title="Process report: findings, improvement areas and element sequence, as a PDF" data-icon="pdf" role="menuitem">PDF</button>
          <button class="btn" id="btn-report-md" title="Same process report, as Markdown text" data-icon="code" role="menuitem">Markdown</button>
          <button class="btn" id="btn-report-docx" title="Same process report, as an editable Word document" data-icon="word" role="menuitem">Word</button>
        </div>
      </div>
      <div class="menu-group menu-group-end" role="group">
        <button class="btn" id="btn-expert-modules" data-icon="modules" title="Turn each expert function on or off" role="menuitem">Choose modules…</button>
      </div>
    </div>
    <button class="btn icon-only" id="btn-properties" data-icon="panel" aria-controls="properties-panel" aria-expanded="true" title="Hide the Process panel" aria-label="Hide the Process panel"></button>
    <span id="autosave-status">Autosave: —</span>
    <a class="btn icon-only" id="btn-help" data-icon="help" href="help.html" target="_blank" rel="noopener" title="Help: how to use the editor" aria-label="Help"></a>
    <button class="btn icon-only" id="btn-theme" data-icon="theme" title="Theme: auto" aria-label="Theme: auto"></button>
    <button class="btn" id="btn-lang" title="Langue : français" aria-label="Switch to French">FR</button>
    <button class="btn icon-only" id="btn-install" data-icon="install" type="button" hidden title="Install BPMN-Pilot as a PWA" aria-label="Install the PWA"></button>
  </div>
  <div id="main">
    <div id="canvas">
      <div id="canvas-tools">
        <div id="history-buttons" role="group" aria-label="History and search">
          <button type="button" id="btn-undo" data-icon="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled></button>
          <button type="button" id="btn-redo" data-icon="redo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled></button>
          <button type="button" id="btn-search" data-icon="search" title="Search the labels and the documentation (Ctrl+F)" aria-label="Search"></button>
          <button type="button" id="btn-plan" data-icon="levels" title="Diagram map: subprocesses, sub-levels and decision tables" aria-label="Diagram map"></button>
        </div>
        <div id="zoom-buttons" role="group" aria-label="Zoom">
          <button type="button" id="btn-zoom-out" data-zoom="out" data-icon="zoom-out" title="Zoom out (Ctrl+−)" aria-label="Zoom out"></button>
          <button type="button" id="btn-zoom-level" data-zoom="level" class="zoom-level" title="Zoom level: click for the zoom slider" aria-label="Zoom level, click for the zoom slider" aria-controls="zoom-slider" aria-expanded="false">100 %</button>
          <button type="button" id="btn-zoom-in" data-zoom="in" data-icon="zoom-in" title="Zoom in (Ctrl++)" aria-label="Zoom in"></button>
          <button type="button" id="btn-zoom-fit" data-zoom="fit" data-icon="zoom-fit" title="Fit the diagram to the screen" aria-label="Fit the diagram to the screen"></button>
        </div>
      </div>
      <div id="credit">Powered by <a href="https://bpmn.io" target="_blank">bpmn.io</a></div>
    </div>
    <div id="properties-panel"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
